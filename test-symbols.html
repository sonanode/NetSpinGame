<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Symbol images test</title>
  <style>
    body { background: #06040f; color: #fff; font-family: sans-serif; padding: 16px; }
    h1 { font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 480px; }
    .item { text-align: center; background: #1e0f3a; padding: 8px; border-radius: 8px; }
    .item img { max-width: 100%; height: 72px; object-fit: contain; }
    .fail { color: #f88; }
  </style>
</head>
<body>
  <h1>Symbol PNG test (stored files, not code-drawn)</h1>
  <p>Folder: <code>assets/symbols/*.png</code></p>
  <div id="grid" class="grid"></div>
  <script type="module">
    import { SYMBOLS, symbolImgUrl } from './js/config.js';
    const grid = document.getElementById('grid');
    SYMBOLS.forEach((sym) => {
      const div = document.createElement('div');
      div.className = 'item';
      const img = document.createElement('img');
      img.alt = sym.name;
      img.src = symbolImgUrl(sym);
      img.onerror = () => { div.classList.add('fail'); div.append(' FAIL'); };
      const cap = document.createElement('p');
      cap.textContent = sym.name;
      div.append(img, cap);
      grid.appendChild(div);
    });
  </script>
</body>
</html>
