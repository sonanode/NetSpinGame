<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>XZENZY — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="vegas-bg"></div>

  <main class="auth-page">
    <header class="auth-hero brand-lockup">
      <span class="brand-logo-x" aria-hidden="true">X</span>
      <div>
        <h1>XZENZY</h1>
        <p class="auth-hero-sub">Members only — sign in to your dashboard and play Neon Vegas slots.</p>
      </div>
    </header>

    <div id="keySetup" class="auth-card key-setup" hidden>
      <p class="auth-social-label">Connect Supabase (one time)</p>
      <p class="key-setup-hint">Supabase → Settings → API Keys → copy <strong>anon public</strong> or <strong>Publishable</strong> key</p>
      <label for="anonKeyInput">API key</label>
      <input id="anonKeyInput" type="password" class="auth-form" placeholder="eyJ... or sb_publishable_..." autocomplete="off" />
      <button type="button" id="saveKeyBtn" class="auth-submit">Save &amp; connect</button>
    </div>

    <p id="configWarn" class="config-warn" hidden></p>

    <div id="authMain" class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-tab="signin">SIGN IN</button>
        <button type="button" class="auth-tab" data-tab="signup">REGISTER</button>
      </div>

      <div class="auth-social">
        <p class="auth-social-label">Quick sign in</p>
        <button type="button" id="btnGoogle" class="auth-social-btn google">Continue with Google</button>
      </div>
      <p class="auth-divider"><span>or use email</span></p>

      <div id="panelSignIn">
        <form id="formSignIn" class="auth-form">
          <label for="inEmail">Email</label>
          <input id="inEmail" name="email" type="email" autocomplete="email" required />

          <label for="inPassword">Password</label>
          <input id="inPassword" name="password" type="password" autocomplete="current-password" required />

          <button type="submit" class="auth-submit">SIGN IN</button>
        </form>
      </div>

      <div id="panelSignUp" hidden>
        <form id="formSignUp" class="auth-form">
          <label for="upName">Display name</label>
          <input id="upName" name="displayName" type="text" autocomplete="nickname" maxlength="32" />

          <label for="upEmail">Email</label>
          <input id="upEmail" name="email" type="email" autocomplete="email" required />

          <label for="upPassword">Password</label>
          <input id="upPassword" name="password" type="password" autocomplete="new-password" minlength="6" required />

          <label for="upPassword2">Confirm password</label>
          <input id="upPassword2" name="password2" type="password" autocomplete="new-password" minlength="6" required />

          <button type="submit" class="auth-submit">CREATE ACCOUNT</button>
        </form>
      </div>

    </div><!-- #authMain -->

    <p id="authMsg" class="auth-msg" hidden></p>

    <footer class="auth-footer">Entertainment only · No real money</footer>
  </main>

  <script src="js/guard.js"></script>
  <script src="js/auth-callback.js"></script>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
