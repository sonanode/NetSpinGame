<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XZENZY">
  <defs>
    <linearGradient id="goldPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="25%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ff8f00"/>
      <stop offset="72%" stop-color="#ff3dff"/>
      <stop offset="100%" stop-color="#ff9af0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" transform-origin="16 17">
    <text
      x="16"
      y="27"
      font-family="Noto Serif Thai, Georgia, Times New Roman, serif"
      font-size="30"
      font-weight="700"
      text-anchor="middle"
      fill="url(#goldPink)">X</text>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 16 17"
      to="360 16 17"
      dur="5s"
      repeatCount="indefinite"/>
  </g>
</svg>
