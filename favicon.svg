<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="XZENZY">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3dff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff9af0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" transform-origin="32 34">
    <text
      x="32"
      y="44"
      font-family="'Noto Serif Thai', Georgia, 'Times New Roman', serif"
      font-size="40"
      font-weight="700"
      text-anchor="middle"
      fill="url(#neon)">X</text>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 32 34"
      to="360 32 34"
      dur="4s"
      repeatCount="indefinite"/>
  </g>
</svg>
