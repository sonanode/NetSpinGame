<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>XZENZY — Neon Vegas 4×5</title>
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css?v=4" />
  <link rel="stylesheet" href="css/style.css?v=6" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="vegas-bg"></div>
  <div class="app">
    <header class="top-bar">
      <div class="brand brand-row">
        <span class="brand-logo-orbit sm" aria-hidden="true">
          <svg class="brand-logo-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="xzenzyLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fff8e1"/>
                <stop offset="22%" stop-color="#ffd54f"/>
                <stop offset="45%" stop-color="#ff8f00"/>
                <stop offset="68%" stop-color="#ff3dff"/>
                <stop offset="100%" stop-color="#ff9af0"/>
              </linearGradient>
              <filter id="xzenzyLogoGlow" x="-35%" y="-35%" width="170%" height="170%">
                <feGaussianBlur stdDeviation="0.65" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g class="brand-logo-spin-g" filter="url(#xzenzyLogoGlow)">
              <text x="20" y="31" text-anchor="middle" font-family="Noto Serif Thai, Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="url(#xzenzyLogoGrad)">X</text>
            </g>
          </svg>
        </span>
        <div>
          <span class="brand-main">XZENZY</span>
          <span class="brand-sub">NEON VEGAS · 4×5 · 40 LINES</span>
        </div>
      </div>
      <div class="user-bar">
        <a href="dashboard.html" class="btn chip" style="text-decoration:none">Dashboard</a>
        <span class="user-email" id="userLabel" title="">Player</span>
        <button type="button" id="logoutBtn" class="btn chip">Log out</button>
      </div>
      <label class="sound-toggle">
        <input type="checkbox" id="soundToggle" checked />
        <span>Sound</span>
      </label>
    </header>

    <section class="jackpots" aria-label="Progressive jackpots">
      <div class="jp jp-mega" data-tier="mega">
        <span class="jp-label">MEGA</span>
        <span class="jp-val" id="jpMega">50,000</span>
      </div>
      <div class="jp jp-major" data-tier="major">
        <span class="jp-label">MAJOR</span>
        <span class="jp-val" id="jpMajor">12,000</span>
      </div>
      <div class="jp jp-minor" data-tier="minor">
        <span class="jp-label">MINOR</span>
        <span class="jp-val" id="jpMinor">2,500</span>
      </div>
      <div class="jp jp-mini" data-tier="mini">
        <span class="jp-label">MINI</span>
        <span class="jp-val" id="jpMini">500</span>
      </div>
    </section>

    <section class="hud">
      <div class="hud-cell">
        <span class="lbl">Balance</span>
        <span class="val" id="balance">0</span>
      </div>
      <div class="hud-cell accent">
        <span class="lbl">Last Win</span>
        <span class="val" id="lastWin">0</span>
      </div>
      <div class="hud-cell">
        <span class="lbl">Win Multiplier</span>
        <span class="val mult" id="winMult">×1</span>
      </div>
      <div class="hud-cell">
        <span class="lbl">Free Spins</span>
        <span class="val" id="freeSpins">—</span>
      </div>
    </section>

    <div class="machine-frame">
      <div class="reels-wrap">
        <canvas id="lineCanvas" class="line-canvas" aria-hidden="true"></canvas>
        <div id="reels" class="reels" role="grid" aria-label="Slot reels 4 by 5"></div>
      </div>
    </div>

    <section class="bet-bar" aria-label="Bet controls">
      <p class="bet-status" id="status">Loading…</p>

      <div class="bet-cards">
        <div class="bet-card">
          <span class="bet-card-lbl">LINE BET</span>
          <div class="bet-stepper">
            <button type="button" id="betDown" class="bet-step" aria-label="Decrease line bet">−</button>
            <span id="lineBet" class="bet-val">1</span>
            <button type="button" id="betUp" class="bet-step" aria-label="Increase line bet">+</button>
          </div>
        </div>

        <div class="bet-card">
          <span class="bet-card-lbl">LINES</span>
          <div class="bet-stepper">
            <button type="button" id="linesDown" class="bet-step" aria-label="Decrease lines">−</button>
            <span id="activeLines" class="bet-val">40</span>
            <button type="button" id="linesUp" class="bet-step" aria-label="Increase lines">+</button>
          </div>
        </div>

        <div class="bet-card bet-card-total">
          <span class="bet-card-lbl">TOTAL BET</span>
          <span id="totalBet" class="bet-val-total">40</span>
        </div>
      </div>

      <div class="bet-mult">
        <span class="bet-mult-lbl">BET MULTIPLIER</span>
        <div class="mult-btns" id="betMultBtns"></div>
      </div>
    </section>

    <section class="actions">
      <button type="button" id="paytableBtn" class="btn side">Paytable</button>
      <button type="button" id="autoBtn" class="btn side">AUTO</button>
      <button type="button" id="spinBtn" class="btn spin-main">SPIN</button>
      <button type="button" id="maxBetBtn" class="btn side">MAX BET</button>
    </section>

    <footer class="footer">
      <a href="dashboard.html">Dashboard</a> · Entertainment only
    </footer>
  </div>

  <div id="bigWin" class="overlay-win">
    <div class="overlay-win-box">
      <p class="ow-tag" id="bigWinTag">BIG WIN</p>
      <p class="ow-amt" id="bigWinAmount">0</p>
      <p class="ow-sub" id="bigWinSub"></p>
    </div>
  </div>

  <div id="jackpotWin" class="overlay-win jp-overlay">
    <div class="overlay-win-box">
      <p class="ow-tag" id="jpWinTag">JACKPOT</p>
      <p class="ow-amt" id="jpWinAmount">0</p>
    </div>
  </div>

  <div id="overlay" class="modal-overlay">
    <div class="modal">
      <header class="modal-head">
        <h2 id="overlayTitle">Info</h2>
        <button type="button" id="overlayClose" class="btn chip">×</button>
      </header>
      <div id="overlayBody" class="modal-body"></div>
    </div>
  </div>

  <script src="js/guard.js"></script>
  <script src="js/auth-callback.js"></script>
  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
